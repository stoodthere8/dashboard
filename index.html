<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<meta name="theme-color" content="#F6F2EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="5분">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" id="fav">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>오늘의 5분</title>
<style>
:root{
  --bg:#F6F2EA; --card:#FFFDF8; --ink:#2B2926; --mu:#6F695F;
  --line:#E3DCCF; --line2:#CFC6B5; --chip:#EDE6D8; --focus:#2B2926; --scrim:rgba(30,26,20,.45); --warn:#9A4B2A;
  --sans:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --serif:var(--sans);
  color-scheme:light dark;
}
.p{--p:var(--pl)}
@media (prefers-color-scheme:dark){
  :root{--bg:#17191E;--card:#22252B;--ink:#ECE9E2;--mu:#A3A8B2;--line:#343841;--line2:#4A4F5A;--chip:#2E323A;--focus:#ECE9E2;--scrim:rgba(0,0,0,.6);--warn:#E39A7B}
  .p{--p:var(--pd)}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--sans);letter-spacing:-.01em;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:28px 18px 72px}
h1,h2,h3{margin:0;font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mu{color:var(--mu)}

.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
.hl{display:flex;align-items:center;gap:14px;min-width:0}
.ht{display:flex;flex-direction:column;gap:2px;min-width:0}
.mk{flex:none;width:56px;height:56px;display:block}
.mk svg{width:100%;height:100%;display:block}
.mk .f{fill:var(--p)}
.mk .o{fill:none;stroke:var(--p);stroke-width:7}
.date{font:400 28px/1.3 var(--serif);letter-spacing:-.03em}
.week{font-size:13px;color:var(--mu);display:flex;align-items:center;flex-wrap:wrap;gap:0 1px}
.vt{background:none;border:0;padding:6px 5px;min-height:32px;font-size:13px;color:var(--mu)}
.week .vt:first-child{padding-left:0}
.vt[aria-current=page]{color:var(--ink);font-weight:600}
.vs{color:var(--line2)}
.wr{margin-left:3px}
.sbar{display:flex;gap:3px;height:10px;margin:6px 0 10px}
.sg{border-radius:5px;background:var(--chip);min-width:6px}
.sg.on{background:var(--p,var(--ink))}
.sg.cur{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--p,var(--ink)) 60%,transparent) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1.5px var(--p,var(--ink))}
.sbar.unset .sg{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2)}
.stg{margin:0 0 18px}
.stg .stbar{margin-bottom:6px}
.goal{font-size:13px;margin:6px 0 0;word-break:keep-all}
.rpt .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
/* 리포트 (14/15/16) */
.insg{display:grid;gap:14px}
.ins .it{font-size:12px;color:var(--mu);letter-spacing:.02em;margin:0 0 6px}
.ins .ih{font:400 17px/1.4 var(--serif);letter-spacing:-.02em;margin:0 0 8px;word-break:keep-all}
.ins .il{margin:0;padding:0 0 0 16px;font-size:13px;color:var(--mu);line-height:1.6;word-break:keep-all}
.ins .is{font-size:12.5px;margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line);word-break:keep-all}
.ins-ov{border-left:4px solid var(--warn)!important}
.hm{display:grid;grid-template-columns:22px repeat(4,1fr);gap:2px;margin-top:12px}
.hh{font-size:11px;color:var(--mu);text-align:center;align-self:center}
.hc{height:24px;border-radius:4px;background:color-mix(in srgb,var(--ink) calc(var(--a)*70%),var(--chip));font-size:11px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
@media(min-width:720px){.insg{grid-column:1/-1;grid-template-columns:1fr 1fr}}

.rs{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.rb{height:22px}
.rb .rs.s-idea{color:var(--ink)}
.rb .rs.s-pau{color:var(--ink);text-shadow:0 0 3px var(--card),0 0 3px var(--card),0 0 3px var(--card)}
.rlg .rs{font-size:0}
.pies{display:grid;gap:22px}
.pblk .ptt{font-size:13px;color:var(--mu);margin:0 0 8px}
.prow{display:flex;gap:16px;align-items:center}
.pwrap{position:relative;width:118px;height:118px;flex:none}
.pie{width:100%;height:100%;display:block}
.pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.pc b{font:400 22px/1.1 var(--serif)}
.pc span{font-size:11px;color:var(--mu)}
.plg{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pl{display:grid;grid-template-columns:9px 1fr auto 34px;align-items:center;gap:7px;font-size:13px}
.pl .dot{width:9px;height:9px;border-radius:50%;background:var(--p)}
.pl .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl b{font-weight:600;font-variant-numeric:tabular-nums}
.pl small{font-size:10px;color:var(--mu);text-align:right;font-variant-numeric:tabular-nums}


.rpt{display:flex;flex-direction:column;gap:14px;padding-bottom:40px}
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px 12px}
.qk{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.qv{font:400 22px/1.2 var(--serif);letter-spacing:-.02em}
.ql{font-size:11px;color:var(--mu);word-break:keep-all}
.rh{font:400 17px/1.3 var(--serif);margin:0 0 4px;letter-spacing:-.02em}
.rsub{font-size:12.5px;color:var(--mu);margin:0 0 12px;word-break:keep-all}
.rlg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mu);margin:0 0 12px}
.rlg span{display:inline-flex;align-items:center;gap:6px}
.rlg .rs{display:inline-block;width:12px;height:12px;border-radius:4px;flex:none}
.rs{min-width:4px}
.rb{display:flex;gap:2px;height:14px;width:100%}
.rb .rs{border-radius:4px;background:var(--p)}
.rs.s-act{background:var(--p,var(--ink))}
.rs.s-idea{background:color-mix(in srgb,var(--p,var(--mu)) 45%,var(--card))}
.rs.s-pau{background:repeating-linear-gradient(135deg,var(--p,var(--mu)) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1.5px var(--p,var(--mu))}
.rs.s-done{background:var(--chip);box-shadow:inset 0 0 0 1.5px var(--p,var(--mu))}
.rs.none{background:var(--chip)}
.rlg .rs.s-act{background:var(--ink)}
.rlg .rs.s-idea{background:color-mix(in srgb,var(--ink) 45%,var(--card))}
.rlg .rs.s-pau{background:repeating-linear-gradient(135deg,var(--ink) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1.5px var(--ink)}
.rlg .rs.s-done{background:var(--chip);box-shadow:inset 0 0 0 1.5px var(--ink)}
.rlg .rs.ld{background:var(--ink)}
.rlg .rs.ef{background:color-mix(in srgb,var(--ink) 40%,var(--card))}
.rrow{display:grid;grid-template-columns:84px 1fr 24px;align-items:center;gap:10px;padding:7px 0}
.rn2{display:inline-flex;align-items:center;gap:7px;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn2 .dot,.th .dot{width:9px;height:9px;border-radius:50%;background:var(--p);flex:none;display:inline-block}
.rtrack{min-width:0}
.rbw{min-width:24px}
.rc{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.brow{padding:8px 0;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0}
.bhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.bd{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.bd.hot{color:var(--warn);font-weight:600}
.bl{display:flex;align-items:center;gap:8px;height:12px;margin:3px 0}
.bar{height:8px;border-radius:2px 4px 4px 2px;min-width:2px}
.bar.ld{background:var(--p)}
.bar.ef{background:color-mix(in srgb,var(--p) 40%,var(--card));box-shadow:inset 0 0 0 1.5px var(--p)}
.bv{font-size:11px;color:var(--mu);font-variant-numeric:tabular-nums;min-width:30px}
.trk{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-top:1px solid var(--line);padding:12px 0 10px;cursor:pointer;border-radius:0}
.trk:first-of-type{border-top:0}
.trk:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.th{display:flex;align-items:center;gap:8px}
.tt{flex:1;min-width:0;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gd{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums;flex:none}
.gd.late{color:var(--warn);font-weight:600}
.tg{font-size:12.5px;color:var(--mu);margin:3px 0 0 17px;word-break:keep-all}
.trk .sbar{margin:8px 0 6px}
.tf{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mu)}
.tf .tn{margin-left:auto}
.wd{display:inline-flex;gap:3px;align-items:center}
.wk{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line2);display:inline-block}
.wk.on{background:color-mix(in srgb,var(--p) 55%,var(--card));box-shadow:none}
.wk.on2{background:var(--p);box-shadow:none}
.rdet summary{cursor:pointer;font-size:13px;color:var(--mu)}
.rtw{overflow-x:auto;margin-top:10px}
.rtab{border-collapse:collapse;font-size:12.5px;width:100%;white-space:nowrap}
.rtab th,.rtab td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.rtab th:first-child,.rtab td:first-child{text-align:left}
@media(min-width:720px){.rpt{display:grid;grid-template-columns:1fr 1fr;align-items:start}.rsum,.rdet,.wide{grid-column:1/-1}}

.hr{display:flex;align-items:center;gap:2px;margin-right:-10px}
.stat{font-size:12px;color:var(--mu);text-align:right;max-width:160px;line-height:1.4}
.lb{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font-size:12px}
.gear{width:44px;height:44px;border-radius:10px;background:none;border:0;color:var(--ink);display:grid;place-items:center}

.stamps{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:6px;padding:6px 4px 2px;margin:0 -4px 6px}
.stamps.many{grid-template-columns:repeat(auto-fit,minmax(40px,1fr));gap:2px}
.stamps.many .ring{width:38px;height:38px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;padding:2px 0;min-height:44px;-webkit-tap-highlight-color:transparent}
.ring{width:44px;height:44px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--p) 65%,transparent);display:grid;place-items:center;transition:box-shadow .15s}
.stamp.on .ring{border:2px solid var(--p);background:color-mix(in srgb,var(--p) 16%,transparent)}
.stamp.nt .ring{border:1.5px solid var(--line2)}
.ring .pt{width:9px;height:9px;border-radius:50%;background:var(--p)}
.stamp.sel .ring{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.stamp .nm{font-size:12px;color:var(--mu)}
.stamp.on .nm{color:var(--ink)}
.stamp.sel .nm{color:var(--ink);font-weight:600}
.bal{font-size:13px;color:var(--mu);margin:0 0 18px;min-height:20px}

.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -18px 28px;padding:2px 18px 4px;scroll-padding:0 18px;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.hero{flex:0 0 88%;min-width:0;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--p,var(--line2));border-radius:18px;padding:16px 16px 14px 18px;display:flex;flex-direction:column}
.rail.one .hero{flex-basis:100%}
.hero .grow{flex:1}
.lead{font-size:13px;color:var(--mu);display:flex;align-items:center;gap:8px;margin-bottom:8px;min-height:32px}
.lead .lt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead .lt.od{color:var(--ink);font-weight:500}
.lead .nv{display:flex;align-items:center;gap:0;flex:none;margin:-4px -8px -4px 0;font-size:12px}
.lead .nv button{width:32px;height:32px;border:0;background:none;color:var(--mu);border-radius:8px;font-size:16px;line-height:1}
.lead .nv span{min-width:34px;text-align:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--p);flex:none}
.act{font:400 20px/1.45 var(--serif);letter-spacing:-.03em;margin:0 0 4px;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:13px;color:var(--mu);margin:0 0 12px;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line2);background:transparent}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:active{transform:scale(.98)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px;color:var(--mu);display:inline-flex;align-items:center;gap:6px}
.tab .n{font-size:12px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.tools{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap;margin:2px 0 6px}
.tl{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);min-height:36px;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.flt{min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;color:var(--mu)}
.flt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.grp{margin:22px 0 6px;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--p) 14%,transparent);font-size:14px;font-weight:600}
.grp .ball{width:18px;height:18px;border-radius:50%;background:var(--p);flex:none}
.grp .c{font-weight:400;font-size:13px;color:var(--mu);margin-left:auto}
.list{border-top:1px solid var(--line)}
.row{position:relative;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 2px 13px 16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.row::before{content:"";position:absolute;left:2px;top:13px;bottom:13px;width:4px;border-radius:2px;background:var(--p,var(--line2))}
.dot.ring{width:11px;height:11px;background:transparent;box-shadow:inset 0 0 0 2px var(--p)}
.rt{font-size:15px;font-weight:500;line-height:1.45;word-break:keep-all}
.rn:empty{display:none}
.rn{word-break:keep-all;font-size:13px;color:var(--mu);line-height:1.5;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rm{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--mu);white-space:nowrap}
.ago.warn{color:var(--ink)}
.ago.stale{color:var(--ink);font-weight:500}
.rv{font-size:12px;border:1px dashed var(--line2);border-radius:6px;padding:0 7px;color:var(--mu)}
.bd{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--chip);color:var(--ink)}
.bd.idea{background:transparent;border:1px dashed var(--line2)}
.bd.paused,.bd.done,.bd.dropped{color:var(--mu)}
.row.lock{align-items:center;color:var(--mu)}
.lk{display:flex;align-items:center;gap:8px;font-size:14px}
.empty{padding:34px 0;text-align:center;color:var(--mu);font-size:14px}

.load{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:20px}
.load p{margin:0 0 12px}
.foot{margin-top:40px;font-size:12px;color:var(--mu);line-height:1.7}

dialog{border:0;padding:0;background:var(--card);color:var(--ink);width:min(560px,100%);max-width:100%;max-height:90vh;margin:auto auto 0;border-radius:18px 18px 0 0}
dialog::backdrop{background:var(--scrim)}
@media (min-width:640px){dialog{margin:auto;border-radius:18px}}
.sheet{padding:22px 20px calc(22px + env(safe-area-inset-bottom));overflow:auto;max-height:90vh}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.sh-p{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
.x{width:44px;height:44px;margin:-8px -10px 0 0;background:none;border:0;border-radius:10px;font-size:22px;line-height:1;color:var(--mu)}
.sh-t{font:400 22px/1.45 var(--serif);letter-spacing:-.03em;margin:0 0 10px;word-break:keep-all}
.meta{overflow:hidden;margin:0 0 12px}
.meta .mi{display:flex;flex-wrap:wrap;margin-left:-11px;margin-bottom:-6px;font-size:13px;color:var(--mu)}
.meta .i{padding:0 10px;border-left:1px solid var(--line2);margin-bottom:6px;line-height:1.5;display:inline-flex;align-items:center}
.meta .fl{color:var(--ink);font-weight:500}
.nx{margin:0 0 18px;font-size:14px;word-break:keep-all}
.nx .l{color:var(--mu);margin-right:8px}
.stampbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.stampbar .l{font-size:13px;color:var(--mu);margin-right:2px}
.stbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.sc{min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;color:var(--mu)}
.sc[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--chip)}
.refs{margin:0 0 20px;padding:0;list-style:none;font-size:14px}
.refs li{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.refs a{color:var(--ink);text-underline-offset:3px}
.refs .d{color:var(--mu);font-size:12px;white-space:nowrap}
.sh-h{font-size:13px;color:var(--mu);margin:0 0 6px}

.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.fld input[type=text],.fld input[type=date],.fld input[type=password],.fld input[type=number],.fld select,.fld textarea,.lrow input,.qadd input,.num{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
.fld textarea{min-height:80px;resize:vertical;line-height:1.5}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;min-height:36px;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.hint{font-size:12px;color:var(--mu);margin:2px 0 12px;line-height:1.5}
.fe{color:var(--warn);font-size:13px;min-height:20px;margin:0 0 8px}

<script>
(function(){
'use strict';
var S={data:null,base:null,sha:null,pending:[],sel:[],view:'home',showDone:false,onlyStale:false,skip:0,opened:{},source:'',
       conn:null,ro:false,status:'idle',statusMsg:'',saving:false,flushTimer:null,flushAt:0,choice:null};
var KEY='fm5.dashboard.conn.v1',CKEY='fm5.dashboard.cache.v1';
var $=function(id){return document.getElementById(id)};

function h(tag,props){
  var e=document.createElement(tag),k,kids=Array.prototype.slice.call(arguments,2);
  props=props||{};
  for(k in props){
    if(k==='class')e.className=props[k];
    else if(k.indexOf('on')===0)e.addEventListener(k.slice(2),props[k]);
    else if(props[k]!==null&&props[k]!==undefined&&props[k]!==false)e.setAttribute(k,props[k]);
  }
  (function add(a){a.forEach(function(c){
    if(c===null||c===undefined||c===false)return;
    if(Array.isArray(c))return add(c);
    e.append(c.nodeType?c:document.createTextNode(c));
  })})(kids);
  return e;
}
function pc(el,p){el.classList.add('p');el.style.setProperty('--pl',p.color);el.style.setProperty('--pd',p.colorDark||p.color);return el}
function put(el){Array.prototype.slice.call(arguments,1).forEach(function(c){if(c===null||c===undefined||c===false)return;el.append(c)})}
function clone(o){return JSON.parse(JSON.stringify(o))}

var DOW=['일','월','화','수','목','금','토'];
function z(n){return (n<10?'0':'')+n}
function nowISO(){var d=new Date();return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds())}
function todayISO(){return nowISO().slice(0,10)}
function utc(){return new Date().toISOString()}
var today=new Date();today.setHours(0,0,0,0);
function pd(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function diff(d){return Math.round((today-d)/86400000)}
var wd=(today.getDay()+6)%7;
var ws=new Date(today);ws.setDate(today.getDate()-wd);
var we=new Date(ws);we.setDate(ws.getDate()+6);
function ago(n){
  if(n<=0)return '오늘';if(n===1)return '어제';
  if(n<60)return n+'일 전';
  if(n<365)return Math.round(n/30)+'개월 전';
  return Math.round(n/365)+'년 전';
}
var ST={active:'활성',paused:'보류',idea:'아이디어',done:'완료',dropped:'폐기'};
var SORT={active:0,idea:1,paused:2,done:3,dropped:4};
var CAD={},CADW={},CADS={},RV={paused:90,idea:60};
var STG_DEF=[{key:'ideation',label:'아이데이션',w:15},{key:'research',label:'조사',w:25},{key:'execute',label:'실행',w:50},{key:'finish',label:'완성',w:10}];
function stages(){var c=S.data&&S.data.config&&S.data.config.stages;return (Array.isArray(c)&&c.length===4)?c:STG_DEF}
function stageOf(x){var a=stages();for(var i=0;i<a.length;i++)if(a[i].key===x.stage)return i;return -1}
function stageKey(v){
  v=String(v||'').trim();if(!v)return '';
  var a=stages();for(var i=0;i<a.length;i++)if(a[i].key===v||a[i].label===v)return a[i].key;
  return null;
}
function stageLabel(k){var a=stages();for(var i=0;i<a.length;i++)if(a[i].key===k)return a[i].label;return ''}
function stagePct(x){
  if(x.status==='done')return 100;
  var i=stageOf(x);if(i<0)return null;
  var a=stages(),tot=0,pre=0;
  a.forEach(function(s,j){tot+=s.w;if(j<i)pre+=s.w});
  return tot>0?Math.round(pre*100/tot):null;
}
function cfg(){
  S.data.config.cadenceOptions.forEach(function(c){CAD[c.key]=c.label;CADW[c.key]=c.warnAfterDays;CADS[c.key]=c.staleAfterDays});
  if(S.data.config.reviewRules)RV=S.data.config.reviewRules;
}
function persona(k){for(var i=0;i<S.data.personas.length;i++)if(S.data.personas[i].key===k)return S.data.personas[i];return null}
function plist(all){
  var a=S.data.personas.slice().sort(function(x,y){return (x.order||0)-(y.order||0)});
  return all?a:a.filter(function(p){return !p.hidden});
}
function pvisible(k){var p=persona(k);return !!p&&!p.hidden}
function target(p){return typeof p.weeklyTarget==='number'?p.weeklyTarget:1}
var PALETTE=[
 ['블루','#5B7FA6','#7FA6D6'],['라벤더','#8A74A8','#B39DDB'],['오커','#C98B4B','#E0A663'],
 ['세이지','#5E9A8F','#6FC2B3'],['로즈','#C17B8C','#E08DA3'],['올리브','#8A9A5B','#A8BF72'],
 ['슬레이트','#6E7F8D','#9FB0BD'],['벽돌','#B5654A','#E39A7B'],['자두','#9A5F86','#CF9BBE'],
 ['이끼','#6F8F5A','#9CC088'],['모래','#A89060','#D3BD8C'],['하늘','#5B93B8','#8CC0E3'],
 ['먹색','#5A5550','#B8B2A8'],['청록','#3F8A8A','#7CC4C4']];
var DEF={cad:{weekly:[7,10],biweekly:[14,21],monthly:[30,45],adhoc:[3,7]},rv:{paused:90,idea:60}};
function days(x){return diff(pd(x.lastTouched))}
function findP(data,id){for(var i=0;i<data.projects.length;i++)if(data.projects[i].id===id)return data.projects[i];return null}
function flag(x){
  if(x.status!=='active'||x.sensitive)return null;
  var s=CADS[x.cadence],w=CADW[x.cadence],n=days(x);
  if(s===null||s===undefined)return null;
  if(n>=s)return 'stale';
  if(w!==null&&w!==undefined&&n>=w)return 'warn';
  return null;
}
function review(x){
  if(x.sensitive)return false;
  if(x.status==='paused')return days(x)>=RV.paused;
  if(x.status==='idea')return days(x)>=RV.idea;
  return false;
}
function touchedThisWeek(p){
  if(pd(p.lastTouched)>=ws)return true;
  return (S.data.log||[]).some(function(l){return l.id===p.id&&l.kind==='checkin'&&new Date(l.ts)>=ws});
}
function weekCount(k){
  return S.data.projects.filter(function(x){return x.persona===k&&x.status!=='dropped'&&x.cadence!=='anytime'&&touchedThisWeek(x)}).length;
}
function personaOn(p){var t=target(p);return t>0&&weekCount(p.key)>=t}

/* ---------- 저장소 연결 정보 ---------- */
function loadConn(){
  try{var a=localStorage.getItem(KEY);if(a){var c=JSON.parse(a);c.remember=true;return c}}catch(e){}
  try{var b=sessionStorage.getItem(KEY);if(b){var d=JSON.parse(b);d.remember=false;return d}}catch(e){}
  return null;
}
function saveConn(c){
  try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY);if(!c||!c.remember)localStorage.removeItem(CKEY)}catch(e){}
  if(!c)return;
  var o={owner:c.owner,repo:c.repo,path:c.path,token:c.token};
  if(c.api)o.api=c.api;
  try{(c.remember?localStorage:sessionStorage).setItem(KEY,JSON.stringify(o))}catch(e){}
}
function cacheSave(){
  if(S.conn&&S.conn.remember){try{localStorage.setItem(CKEY,JSON.stringify({sha:S.sha,data:S.base}))}catch(e){}}
}
function cacheLoad(){try{return JSON.parse(localStorage.getItem(CKEY)||'null')}catch(e){return null}}

/* ---------- GitHub 파일 API ---------- */
function apiBase(){return (S.conn&&S.conn.api)||'https://api.github.com'}
function fileUrl(bust){
  var c=S.conn;
  return apiBase()+'/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+c.path.split('/').map(encodeURIComponent).join('/')+(bust?'?t='+Date.now():'');
}
function hdr(){return {'Authorization':'Bearer '+S.conn.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
function dec(b64){var bin=atob(b64.replace(/\s/g,'')),u=new Uint8Array(bin.length),i;for(i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function enc(str){var u=new TextEncoder().encode(str),s='',i;for(i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function httpErr(r){var e=new Error('http '+r.status);e.status=r.status;return e}
function ghGet(){
  return fetch(fileUrl(true),{headers:hdr()}).then(function(r){if(!r.ok)throw httpErr(r);return r.json()}).then(function(j){
    return {sha:j.sha,data:JSON.parse(dec(j.content))};
  });
}
function ghPut(data,sha,msg){
  var body={message:msg,content:enc(JSON.stringify(data,null,2)+'\n'),sha:sha};
  return fetch(fileUrl(false),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hdr()),body:JSON.stringify(body)})
    .then(function(r){if(!r.ok)throw httpErr(r);return r.json()}).then(function(j){return j.content.sha});
}
function repoExists(c){
  return fetch(apiBase()+'/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo),{headers:hdr()})
    .then(function(r){return r.ok}).catch(function(){return null});
}
function errText(e){
  if(e&&(e.status===401||e.status===403))return '토큰을 확인해 주세요';
  if(e&&e.status===404)return '저장소나 파일을 찾지 못했어요';
  if(e&&e.status)return '저장 못 했어요';
  return '네트워크에 연결되지 않았어요';
}

/* ---------- 변경 작업(op) 모델 ---------- */
function nextId(data,pk){
  var m=0;
  data.projects.forEach(function(p){if(p.id.charAt(0)===pk){var n=parseInt(p.id.slice(1),10);if(n>m)m=n}});
  return pk+z(m+1);
}
function findPe(data,k){for(var i=0;i<data.personas.length;i++)if(data.personas[i].key===k)return data.personas[i];return null}
var LETTERS='ABDEFGIJKLNOQTUVWXYZ';
function freeKey(data){for(var i=0;i<LETTERS.length;i++)if(!findPe(data,LETTERS.charAt(i)))return LETTERS.charAt(i);return null}
function setFields(obj,patch,at){
  if(!obj.fieldAt)obj.fieldAt={};
  var skipped=0;
  Object.keys(patch).forEach(function(k){
    var cur=obj.fieldAt[k]||'';
    if(at>=cur){obj[k]=patch[k];obj.fieldAt[k]=at}else skipped++;
  });
  if(!obj.updatedAt||at>obj.updatedAt)obj.updatedAt=at;
  return skipped;
}
function setCfg(c,k,v){
  var a=k.split('.');
  if(a[0]==='cad'){c.cadenceOptions.forEach(function(o){if(o.key===a[1]){if(a[2]==='warn')o.warnAfterDays=v;else o.staleAfterDays=v}})}
  else if(a[0]==='rv'){if(!c.reviewRules)c.reviewRules={paused:90,idea:60};c.reviewRules[a[1]]=v}
  else if(a[0]==='stg'){
    if(!Array.isArray(c.stages)||c.stages.length!==4)c.stages=clone(STG_DEF);
    c.stages.forEach(function(g){if(g.key===a[1]){if(a[2]==='label')g.label=v;else g.w=v}});
  }
}
function applyOp(data,op){
  var p,np,l,n,mx;
  if(op.t==='update'){
    p=findP(data,op.id);if(!p)return false;
    op.skipped=setFields(p,op.patch,op.at);
    if(op.log)data.log.push(op.log);
    return true;
  }
  if(op.t==='add'){
    np=clone(op.project);

function scheduleFlush(ms){
  var when=Date.now()+ms;
  if(S.flushTimer&&S.flushAt<=when)return;
  clearTimeout(S.flushTimer);S.flushAt=when;
  S.flushTimer=setTimeout(function(){S.flushTimer=null;S.flushAt=0;flush()},ms);
  if(ms>0&&S.status!=='saving'&&S.status!=='error')setStatus('pending');
}
function flush(){
  clearTimeout(S.flushTimer);S.flushTimer=null;S.flushAt=0;
  if(S.saving||!S.pending.length||!S.conn)return Promise.resolve();
  S.saving=true;setStatus('saving');
  var snap=S.pending.slice();
  snap.forEach(function(o){o.locked=true});
  return attempt(snap,0).then(function(){
    S.saving=false;setStatus('saved');
    if(S.pending.length)scheduleFlush(0);
  }).catch(function(e){
    S.saving=false;snap.forEach(function(o){o.locked=false});
    setStatus('error',errText(e));

}
function commitMsg(snap){
  var m=snap.map(function(o){return o.msg}).filter(Boolean);
  return (m.length?m.join(' / '):'update').slice(0,100);

function attempt(snap,n){
  var data=norm(clone(S.base));

  data.updatedAt=utc();
  if(data.log.length>500)data.log=data.log.slice(-500);
  return ghPut(data,S.sha,commitMsg(snap)).then(function(sha){
    S.sha=sha;S.base=data;
    S.pending=S.pending.filter(function(o){return snap.indexOf(o)<0});
    recompute();cacheSave();rerender();

    if((e.status===409||e.status===422)&&n<3){
      return resolveConflict(snap).then(function(kept){

}

  if(o.t==='update'&&o.patch&&o.patch.persona===oldK)o.patch.persona=newK;
  if(o.t==='persona'&&o.key===oldK)o.key=newK;

function resolveConflict(snap){
  return ghGet().then(function(remote){
    var work=norm(clone(remote.data));
    var skipped=0,missing=0,kept=[];
    snap.forEach(function(op,i){
      if(op.t==='update'||op.t==='delete'){
        if(!findP(work,op.id)){missing++;return}
      }else if(op.t==='persona'&&(op.a==='update'||op.a==='delete')){
        if(!findPe(work,op.key)){missing++;return}
      }
      var wantId=op.t==='add'?op.newId:null;
      var wantKey=(op.t==='persona'&&op.a==='add')?op.key:null;
      applyOp(work,op);skipped+=op.skipped||0;kept.push(op);
      var rest=snap.slice(i+1).concat(S.pending);
      if(wantId&&op.newId!==wantId)rest.forEach(function(o){if(o.id===wantId)o.id=op.newId});
      if(wantKey&&op.key!==wantKey)rest.forEach(function(o){remapKey(o,wantKey,op.key)});
    });
    S.base=remote.data;S.sha=remote.sha;
    S.pending=S.pending.filter(function(o){return snap.indexOf(o)<0||kept.indexOf(o)>=0});
    recompute();rerender();
    if(skipped)showToast('다른 기기에서 더 늦게 수정된 내용이 있어, 그 부분은 그대로 뒀어요',null,5000);
    else if(missing)showToast('다른 기기에서 삭제된 항목은 변경을 건너뛰었어요',null,4000);
    return kept;
  });
}

function dueDays(s){return -diff(pd(s))}

  (x.queue||[]).forEach(function(it){
    if(it.due&&(!best||it.due<best.date))best={date:it.due,src:'queue',text:it.t};
  });
  if(best)best.days=dueDays(best.date);
  return best;

/* ---------- 작업: 체크인·상태 변경 ---------- */
function checkin(x){
  if(!canEdit())return;
  var q=x.queue||[];
  var patch={lastTouched:todayISO()};
  var done=(x.nextAction||'').trim();
  if(q.length){patch.nextAction=q[0].t;patch.nextDue=q[0].due||'';patch.queue=q.slice(1)}
  else{patch.nextAction='';patch.nextDue=''}
  var op={t:'update',id:x.id,patch:patch,msg:'체크인: '+x.id+' '+x.title,
    prev:{lastTouched:x.lastTouched,nextAction:x.nextAction||'',nextDue:x.nextDue||'',queue:q},
    log:{ts:utc(),id:x.id,kind:'checkin',note:done?'완료: '+done:'',statusFrom:x.status,statusTo:x.status}};
  enqueue(op,5000);
  var acts=[{t:'되돌리기',fn:function(){undoOp(op)}},{t:'다음 행동 정하기',fn:function(){openNext(findP(S.data,x.id)||x)}}];
  if(x.status==='paused'||x.status==='idea')acts.push({t:'활성으로 바꾸기',fn:function(){changeStatus(findP(S.data,x.id)||x,'active')}});
  showToast(x.title+', 체크인했어요',acts,5000);
}
function advance(x){
  if(!canEdit())return;
  var q=x.queue||[];if(!q.length)return;
  var nx=q[0];
  enqueue({t:'update',id:x.id,patch:{nextAction:nx.t,nextDue:nx.due||'',queue:q.slice(1),lastTouched:todayISO()},msg:'다음 단계: '+x.id+' '+x.title,
    log:{ts:utc(),id:x.id,kind:'checkin',note:'완료: '+(x.nextAction||''),statusFrom:x.status,statusTo:x.status}},0);
  showToast('다음 한 걸음으로 넘어갔어요',null,2400);
}
function splitNext(x){
  if(!canEdit())return;
  var tk=(x.nextAction||'').split(/[,，]/).map(function(t){return t.trim()}).filter(Boolean);
  if(tk.length<2)return;
  enqueue({t:'update',id:x.id,patch:{nextAction:tk[0],queue:tk.slice(1).map(function(t){return {t:t}}).concat(x.queue||[])},msg:'대기열로 나눔: '+x.id,
    log:{ts:utc(),id:x.id,kind:'edit',note:'다음 행동을 대기열로 나눔',statusFrom:x.status,statusTo:x.status}},0);
  openSheet(x.id);
}
function undoOp(op){
  var i=S.pending.indexOf(op);
  if(i>=0&&!op.locked){
    S.pending.splice(i,1);recompute();rerender();
    if(!S.pending.length&&S.status==='pending'){clearTimeout(S.flushTimer);S.flushTimer=null;S.flushAt=0;setStatus('saved')}
    return;
  }
  var x=findP(S.data,op.id);if(!x)return;
  enqueue({t:'update',id:op.id,patch:op.prev,msg:'체크인 취소: '+op.id,
    log:{ts:utc(),id:op.id,kind:'undo',note:'',statusFrom:x.status,statusTo:x.status}},0);
}
function changeStatus(x,s,extra,label){
  if(!canEdit())return;
  if(x.status===s&&!extra)return;
  var patch=Object.assign({status:s},extra||{});
  enqueue({t:'update',id:x.id,patch:patch,msg:'상태: '+x.id+' '+ST[x.status]+'→'+ST[s],
    log:{ts:utc(),id:x.id,kind:'status',note:label||'',statusFrom:x.status,statusTo:s}},0);
  closeDlg();
  showToast(x.title+', '+ST[s]+'(으)로 바꿨어요',null,2600);

function openRules(){
  if(needData())return;
  var cur={};
  S.data.config.cadenceOptions.forEach(function(c){cur[c.key]=[c.warnAfterDays,c.staleAfterDays]});
  var rv=S.data.config.reviewRules||DEF.rv;
  var ins={};
  function num(id,val){var e=ctl('input',id,val,{type:'number',min:'1',max:'730',step:'1',inputmode:'numeric'});e.className='num';return e}
  var grid=h('div',{class:'rulegrid'},h('span'),h('span',{class:'mu'},'곧 밀림 (일)'),h('span',{class:'mu'},'방치 (일)'));
  ['weekly','biweekly','monthly','adhoc'].forEach(function(k){
    ins[k]=[num('r-'+k+'-w',cur[k][0]),num('r-'+k+'-s',cur[k][1])];
    grid.append(h('span',null,CAD[k]),ins[k][0],ins[k][1]);
  });
  grid.append(h('span',null,'언제든지'),h('span',{class:'mu'},'없음'),h('span',{class:'mu'},'없음'));
  var rp=num('r-rp',rv.paused),ri=num('r-ri',rv.idea);
  var err=h('div',{class:'fe',id:'r-e',role:'alert'});
  function fillDefaults(){
    Object.keys(DEF.cad).forEach(function(k){ins[k][0].value=DEF.cad[k][0];ins[k][1].value=DEF.cad[k][1]});
    rp.value=DEF.rv.paused;ri.value=DEF.rv.idea;err.textContent='기본값을 채웠어요. 저장을 눌러 적용하세요.';
  }
  function save(){
    if(!canEdit())return;
    var patch={},bad='';
    Object.keys(ins).forEach(function(k){
      var w=Number(ins[k][0].value),s=Number(ins[k][1].value);
      if(!Number.isInteger(w)||!Number.isInteger(s)||w<1||s>365){bad=CAD[k]+': 1~365 사이의 정수로 적어 주세요';return}
      if(w>=s){bad=CAD[k]+': 곧 밀림은 방치보다 작아야 해요';return}
      if(w!==cur[k][0])patch['cad.'+k+'.warn']=w;
      if(s!==cur[k][1])patch['cad.'+k+'.stale']=s;
    });
    if(!bad){
      var a=Number(rp.value),b=Number(ri.value);
      if(!Number.isInteger(a)||!Number.isInteger(b)||a<7||b<7||a>730||b>730)bad='정리 후보 기준은 7~730일 사이의 정수로 적어 주세요';
      else{if(a!==rv.paused)patch['rv.paused']=a;if(b!==rv.idea)patch['rv.idea']=b}
    }
    if(bad){err.textContent=bad;return}
    if(!Object.keys(patch).length){openSettings();return}
    enqueue({t:'config',patch:patch,msg:'기준 변경'},0);
    showToast('저장했어요',null,2000);
    openSettings();
  }
  var sh=$('sheet');sh.textContent='';
  put(sh,topBar(null,openSettings),h('h3',{class:'sh-t',id:'sh-t'},'기준과 규칙'),
    h('p',{class:'hint'},'활성 항목에 적용돼요. 민감 항목은 경고를 받지 않아요.'),
    grid,
    h('p',{class:'sh-h'},'정리 후보'),
    h('div',{class:'f2'},fld('보류가 넘으면 (일)',rp),fld('아이디어가 넘으면 (일)',ri)),
    err,
    h('div',{class:'btns'},h('button',{class:'btn pri',type:'button',id:'r-save',onclick:save},'저장'),h('button',{class:'btn',type:'button',id:'r-def',onclick:fillDefaults},'기본값 채우기')));
  openDlg();
}

  var rows=[],grid=h('div',{class:'rulegrid'},h('span'),h('span',{class:'mu'},'이름'),h('span',{class:'mu'},'비중 (%)'));

    var wi=ctl('input','s-'+g.key+'-w',g.w,{type:'number',min:'0',max:'100',step:'1',inputmode:'numeric'});wi.className='num';
    rows.push({g:g,n:ni,w:wi});

  function save(){
    if(!canEdit())return;
    var patch={},tot=0,bad='';
    rows.forEach(function(r){
      var l=r.n.value.trim(),w=Number(r.w.value);
      if(!l){bad='단계 이름을 비워 둘 수 없어요';return}
      if(!Number.isInteger(w)||w<0||w>100){bad='비중은 0~100 사이의 정수로 적어 주세요';return}
      tot+=w;
      if(l!==r.g.label)patch['stg.'+r.g.key+'.label']=l;
      if(w!==r.g.w)patch['stg.'+r.g.key+'.w']=w;
    });
    if(!bad&&tot<=0)bad='비중의 합이 0이에요';
    if(bad){err.textContent=bad;return}
    if(!Object.keys(patch).length){openSettings();return}
    enqueue({t:'config',patch:patch,msg:'단계 변경'},0);
    showToast('저장했어요',null,2000);

  }
  var sh=$('sheet');sh.textContent='';
  put(sh,topBar(null,openSettings),h('h3',{class:'sh-t',id:'sh-t'},'단계 이름과 비중'),
    h('p',{class:'hint'},'비중은 그 단계가 나에게 주는 부담의 크기예요. 합이 100이 아니어도 비율로 계산해요. 진행률은 지나온 단계의 비중 합이에요.'),
    grid,err,
    h('div',{class:'btns'},h('button',{class:'btn pri',type:'button',id:'s-save',onclick:save},'저장'),h('button',{class:'btn',type:'button',id:'s-def',onclick:fill},'기본값 채우기')));
  openDlg();
}

function admRow(x){
  var id=x.id;
  if(x.sensitive&&!AD.sens)return h('tr',{class:'mask','data-id':id},h('td',null,id),h('td',{colspan:'8'},'민감 항목 (위의 "민감 항목 표시"를 켜면 보여요)'));
  function cur(){return findP(S.data,id)}
  function upd(k,v){
    if(!canEdit())return;
    var c=cur();if(!c)return;
    var old=c[k];
    if(old===v||((old===undefined||old===null)&&v===''))return;
    var patch={};patch[k]=v;
    enqueue({t:'update',id:id,patch:patch,msg:'표 수정: '+id+' '+k,
      log:{ts:utc(),id:id,kind:k==='status'?'status':'edit',note:'표 편집',statusFrom:c.status,statusTo:k==='status'?v:c.status}},800);
  }
  var tt=inp({type:'text',maxlength:'80','aria-label':id+' 제목','data-f':'title'});tt.value=x.title;
  tt.addEventListener('change',function(){var v=tt.value.trim();if(!v){tt.value=cur().title;showToast('제목은 비울 수 없어요',null,2000);return}upd('title',v)});
  var pp=sel('a-p-'+id,plist(true).map(function(p){return [p.key,p.name]}),x.persona);pp.setAttribute('data-f','persona');
  pp.addEventListener('change',function(){upd('persona',pp.value)});
  var ss=sel('a-s-'+id,S.data.config.statusOptions.map(function(o){return [o.key,o.label]}),x.status);ss.setAttribute('data-f','status');
  ss.addEventListener('change',function(){upd('status',ss.value)});
  var cc=sel('a-c-'+id,S.data.config.cadenceOptions.map(function(o){return [o.key,o.label]}),x.cadence);cc.setAttribute('data-f','cadence');

var DIFFLAB={title:'제목',status:'상태',cadence:'케이던스',lastTouched:'마지막 터치',sensitive:'민감',nextAction:'다음 행동',nextDue:'마감일',refs:'관련 대화',queue:'대기열',persona:'페르소나',stage:'단계',goal:'최종 목표',goalDue:'최종 마감일'};

function parseText(text){
  revMaps();
  var res={adds:[],ups:[],dels:[],errs:[]};
  text.split(/\r?\n/).forEach(function(ln,i){
    var raw=ln.trim();
    if(!/^(새-[A-Za-z]|[A-Za-z]\d{2,})\s*\|/.test(raw))return;
    if(/\|$/.test(raw))raw+=' ';
    var f=raw.split(/\s\|\s/).map(function(x){return x.trim()});
    function err(m){res.errs.push('줄 '+(i+1)+': '+m)}
    var code=f[0];
    if(code.indexOf('새-')===0){
      var pe=persona(code.slice(2).toUpperCase());
      if(!pe)return err('없는 페르소나 글자 '+code.slice(2));
      var c=buildCard(f,pe.key,err);if(c)res.adds.push(c);
      return;
    }
    var x=findP(S.data,code.toUpperCase());
    if(!x)return err('없는 코드 '+code);
    if(f[2]==='삭제'){res.dels.push(x);return}
    var c2=buildCard(f,x.persona,err,x);if(!c2)return;
    var patch=diffCard(x,c2);
    if(Object.keys(patch).length)res.ups.push({x:x,patch:patch});
  });
  markDup(res);
  return res;
}
function parseJSONCards(text){

  arr.forEach(function(o,i){
    function err(m){res.errs.push('카드 '+(i+1)+': '+m)}
    if(!o||typeof o!=='object')return err('객체가 아니에요');
    var old=o.id?findP(S.data,String(o.id)):null;
    var pe=o.persona?(persona(String(o.persona))||plist(true).filter(function(q){return q.name===o.persona||q.short===o.persona})[0]):null;
    var pk=pe?pe.key:(old?old.persona:null);
    if(!pk)return err('persona(코드 글자 또는 이름)를 확인해 주세요');
    var title=String(o.title||'').trim();if(!title)return err('title이 비어 있어요');
    var st=o.status?(ST[o.status]?o.status:REV_ST[o.status]):(old?old.status:'idea');if(!st){return err('status를 확인해 주세요: '+o.status)}

    var nd=o.nextDue?String(o.nextDue):(old?(old.nextDue||''):'');if(nd&&!validDate(nd))return err('nextDue 날짜를 확인해 주세요');

      try{var t=typeof r==='string'?r:(r.t||r.title||'');var u=typeof r==='string'?'':(r.url||'');var pr=parseLink(t,u,todayISO());if(pr)refs.push(pr)}catch(ex){bad=String(ex)}

    var card={persona:pk,title:title,status:st,cadence:cd,lastTouched:lt,stage:sgk,goal:gl,goalDue:gd,sensitive:o.sensitive===undefined?(old?!!old.sensitive:false):!!o.sensitive,
      nextAction:o.nextAction===undefined?(old?old.nextAction||'':''):String(o.nextAction),nextDue:nd,refs:refs,queue:queue};

  if(e.kind==='add')return !!x;
  if(e.kind==='delete')return !!e.before&&!x;
  if(e.kind==='checkin'||e.kind==='status'||e.kind==='edit')return !!e.before&&!!x;
  return false;
}
function revertLog(e){
  if(!canEdit()||!canRevert(e))return;
  var x=findP(S.data,e.id);
  if(e.kind==='add'){
    enqueue({t:'delete',id:e.id,msg:'이력 되돌림: 추가 취소 '+e.id,log:{ts:utc(),id:e.id,kind:'delete',note:x.title+' (이력에서 추가를 취소)',statusFrom:x.status,statusTo:''}},0);
  }else if(e.kind==='delete'){
    var pj=clone(e.before);var oid=pj.id;delete pj.id;delete pj.fieldAt;delete pj.updatedAt;
    enqueue({t:'add',project:pj,newId:oid,msg:'이력 되돌림: 삭제 복원 '+oid,log:{ts:utc(),id:oid,kind:'add',note:pj.title+' (이력에서 복원)',statusFrom:'',statusTo:pj.status}},0);
  }else{
    enqueue({t:'update',id:e.id,patch:clone(e.before),msg:'이력 되돌림: '+e.id,log:{ts:utc(),id:e.id,kind:'undo',note:'이력에서 되돌림',statusFrom:x.status,statusTo:(e.before.status||x.status)}},0);
  }
  showToast('되돌렸어요',null,2000);
  renderAdmin();
}
function admLog(box){
  var log=(S.data.log||[]).slice().reverse();
  box.append(h('p',{class:'hint'},'최근 '+Math.min(AD.logN,log.length)+'건 (전체 '+log.length+'건, 최대 500건 보관). "되돌리기"는 바뀌기 전 값이 기록된 항목에서만 나와요. 페르소나·설정 변경은 GitHub 저장소의 커밋 기록에서 확인할 수 있어요.'));
  if(!log.length){box.append(h('p',{class:'empty'},'아직 기록이 없어요.'));return}
  log.slice(0,AD.logN).forEach(function(e){
    var d=new Date(e.ts),ts=isNaN(d.getTime())?'':(d.getMonth()+1)+'/'+d.getDate()+' '+z(d.getHours())+':'+z(d.getMinutes());
    var x=findP(S.data,e.id);
    var name=x?x.title:(e.note||e.id);
    if(x&&x.sensitive&&!AD.sens)name='민감 항목';
    var det=(KIND[e.kind]||e.kind)+(e.statusFrom&&e.statusTo&&e.statusFrom!==e.statusTo?' · '+ST[e.statusFrom]+'→'+ST[e.statusTo]:'')+(e.note&&x?' · '+e.note:'');
    if(x&&x.sensitive&&!AD.sens)det=KIND[e.kind]||e.kind;
    box.append(h('div',{class:'lg','data-k':e.kind},
      h('span',{class:'lt'},ts),
      h('span',null,h('div',null,(e.id?e.id+' ':'')+name),h('div',{class:'ln'},det)),
      canRevert(e)&&!(x&&x.sensitive&&!AD.sens)?h('button',{class:'btn sm','data-rv':'1',type:'button',onclick:function(){revertLog(e)}},'되돌리기'):h('span')));
  });
  if(log.length>AD.logN)box.append(h('div',{class:'btns',style:'margin-top:12px'},h('button',{class:'btn',type:'button',onclick:function(){AD.logN+=60;renderAdmin()}},'더 보기')));
}

/* 점검 */
function admCheck(box){
  var P=S.data.projects,ns=P.filter(function(x){return !x.sensitive});
  var due=ns.filter(function(x){return x.status!=='done'&&x.status!=='dropped'&&isUrgent(x)}).sort(function(a,b){return effDue(a).days-effDue(b).days});
  var emptyNext=ns.filter(function(x){return x.status==='active'&&!(x.nextAction||'').trim()});
  var nolink=ns.filter(function(x){return (x.refs||[]).some(function(r){return !r.chatId&&!r.url})});
  var stale=ns.filter(function(x){return flag(x)==='stale'});
  var rev=ns.filter(review);
  var seen={},dups=[];
  ns.forEach(function(x){var k=normT(x.title);if(seen[k]){if(dups.indexOf(seen[k])<0)dups.push(seen[k]);dups.push(x)}else seen[k]=x});
  box.append(h('div',{class:'sumbar'},
    h('span',null,'항목 '+P.length+'개'),h('span',null,'페르소나 '+S.data.personas.length+'개 (숨김 '+S.data.personas.filter(function(p){return p.hidden}).length+')'),
    h('span',null,'이력 '+(S.data.log||[]).length+'건'),h('span',null,'민감 '+P.filter(function(x){return x.sensitive}).length+'개 (점검에서 제외)')));
  function sec(id,title,arr,extra){
    var s=h('div',{class:'sec','data-sec':id},h('h3',null,title+' '+arr.length+'개'));
    if(!arr.length)s.append(h('p',{class:'hint'},'없어요.'));
    arr.forEach(function(x){
      s.append(h('button',{class:'crow','data-id':x.id,type:'button',onclick:function(){openSheet(x.id)}},h('span',null,x.id+' '+x.title),h('span',{class:'mu'},extra?extra(x):'')));
    });
    box.append(s);
  }
  sec('due','마감 임박·지남 (3일 이내)',due,function(x){var e=effDue(x);return dueFull(e.date)});
  sec('stale','방치 중',stale,function(x){return CAD[x.cadence]+' · '+ago(days(x))});
  sec('review','정리 후보 (보류·아이디어가 오래됨)',rev,function(x){return ST[x.status]+' · '+ago(days(x))});
  sec('empty','다음 행동이 비어 있는 활성 항목 (체크인 후 아직 정하지 않았거나 처음부터 없는 항목)',emptyNext);
  sec('nolink','링크가 없는 관련 대화가 있는 항목',nolink,function(x){return (x.refs||[]).filter(function(r){return !r.chatId&&!r.url}).length+'개'});
  sec('dup','제목이 비슷한 항목 (중복 의심)',dups);
}

/* ---------- 연결 ---------- */
function openConn(){
  var c=S.conn||{};
  var f={o:ctl('input','c-o',c.owner||'',{type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false',placeholder:'GitHub 아이디'}),
         r:ctl('input','c-r',c.repo||'dashboard-data',{type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false'}),
         p:ctl('input','c-p',c.path||'data.json',{type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false'}),
         t:ctl('input','c-t','',{type:'password',autocomplete:'off',spellcheck:'false',placeholder:c.token?'저장된 토큰 사용 중 (바꾸려면 새로 입력)':'github_pat_…'}),
         m:ctl('input','c-m',null,{type:'checkbox'})};
  f.m.checked=!!c.remember;
  var msg=h('div',{class:'fe',id:'c-e',role:'alert'});
  var sh=$('sheet');sh.textContent='';
  function connect(){
    var o=f.o.value.trim(),r=f.r.value.trim(),p=f.p.value.trim().replace(/^\/+/,''),t=f.t.value.trim()||(c.token||'');
    if(!o||!r||!p){msg.textContent='저장소 주인, 이름, 파일 경로를 모두 입력해 주세요';return}
    if(!t){msg.textContent='토큰을 입력해 주세요';return}
    var next={owner:o,repo:r,path:p,token:t,remember:f.m.checked};
    if(c.api)next.api=c.api;
    var prev=S.conn;S.conn=next;msg.textContent='확인하는 중…';
    ghGet().then(function(rem){
      S.ro=false;S.sha=rem.sha;S.base=rem.data;if(!S.base.log)S.base.log=[];S.pending=[];
      saveConn(next);recompute();cacheSave();
      showApp();
      closeDlg();rerender();setStatus('saved');showToast('연결됐어요',null,2400);afterLoad();
    }).catch(function(e){
      var c=S.conn;
      function fin(text){S.conn=prev;msg.textContent=text}
      if(e&&e.status===404){
        repoExists(c).then(function(ok){
          if(ok===true)fin('저장소는 찾았지만 파일을 못 찾았어요. 저장소 첫 화면에 '+c.path+' 파일이 폴더 없이 있는지, 파일 이름과 경로가 같은지 확인해 주세요 (404)');
          else if(ok===false)fin('저장소를 찾지 못했어요. 저장소 주인(GitHub 아이디)과 이름의 철자, 그리고 토큰이 이 저장소를 선택했는지(Contents 읽기·쓰기) 확인해 주세요 (404)');
          else fin('네트워크에 연결되지 않았어요');
        });
        return;
      }
      fin(errText(e).replace('저장 못 했어요','연결하지 못했어요')+(e&&e.status?' ('+e.status+')':''));
    });
  }
  function disconnect(){
    if(S.pending.length&&!window.confirm('저장 안 된 변경이 있어요. 그래도 연결을 해제할까요?'))return;
    saveConn(null);S.conn=null;S.base=null;S.data=null;S.pending=[];S.sha=null;
    closeDlg();showDisconnected();
  }
  put(sh,topBar(null),
    h('h3',{class:'sh-t',id:'sh-t'},'저장소 연결'),
    h('p',{class:'hint'},'데이터가 들어 있는 비공개 저장소의 파일을 읽고 저장해요. 토큰은 그 저장소 하나에만 읽기·쓰기 권한이 있는 것을 쓰세요.'),
    fld('저장소 주인',f.o),fld('저장소 이름',f.r),fld('파일 경로',f.p),fld('토큰',f.t),
    h('label',{class:'ck'},f.m,'이 기기에서 기억'),
    h('p',{class:'hint'},'꺼 두면 탭을 닫을 때 지워져요. 공용 PC에서는 끄세요.'),
    msg,
    h('div',{class:'btns'},
      h('button',{class:'btn pri',type:'button',id:'c-ok',onclick:connect},'연결 확인'),
      S.conn?h('button',{class:'btn',type:'button',id:'c-off',onclick:disconnect},'연결 해제'):null));
  openDlg();
}
function showDisconnected(){
  document.querySelectorAll('#app > section').forEach(function(s){s.style.display='none'});
  $('foot').textContent='';setStatus('noconn');
  var box=$('loader');box.textContent='';
  box.append(h('div',{class:'load'},h('p',null,'저장소를 연결하면 항목이 보여요.'),
    h('button',{class:'btn pri',type:'button',id:'conn-open',onclick:openConn},'저장소 연결'),
    h('p',{class:'hint',style:'margin-top:16px'},'파일만 확인하고 싶다면 data.json을 직접 불러올 수도 있어요(읽기 전용).'),
    h('input',{type:'file',accept:'.json,application/json',id:'fi',onchange:function(){
      var fl=this.files[0];if(!fl)return;var rd=new FileReader();
      rd.onload=function(){try{loadReadonly(JSON.parse(rd.result),fl.name)}catch(e){showToast('JSON을 읽지 못했어요. 파일을 확인해 주세요',null,3000)}};
      rd.readAsText(fl);
    }})));
}
function showApp(){document.querySelectorAll('#app > section').forEach(function(s){s.style.display=''});$('loader').textContent=''}
function loadReadonly(data,name){
  S.ro=true;S.source=name;S.base=data;if(!S.base.log)S.base.log=[];S.pending=[];recompute();showApp();rerender();setStatus('ro');
}

/* ---------- 이벤트 ---------- */
$('dlg').addEventListener('click',function(e){if(e.target===this)this.close()});
$('done').addEventListener('change',function(){S.showDone=this.checked;renderTabs();renderList()});
$('flt').addEventListener('click',function(){S.onlyStale=!S.onlyStale;renderList()});
$('new').addEventListener('click',function(){if(S.data)openForm('new')});
$('gear').addEventListener('click',openSettings);
$('adm-back').addEventListener('click',closeAdmin);
window.addEventListener('beforeunload',function(e){if(S.pending.length||S.status==='error'){e.preventDefault();e.returnValue=''}});
window.addEventListener('online',function(){if(S.status==='error')flush()});

/* ---------- 시작 ---------- */
function boot(){
  renderHead();drawMark(null);
  S.conn=loadConn();
  if(S.conn){
    var cache=S.conn.remember?cacheLoad():null;
    if(cache&&cache.data){S.sha=cache.sha;S.base=cache.data;if(!S.base.log)S.base.log=[];recompute();showApp();rerender()}
    setStatus('load');
    ghGet().then(function(rem){
      S.sha=rem.sha;S.base=rem.data;if(!S.base.log)S.base.log=[];S.pending=[];recompute();cacheSave();showApp();rerender();setStatus('saved');afterLoad();
    }).catch(function(e){
      if(S.base){setStatus('error',errText(e).replace('저장 못 했어요','불러오지 못했어요')+' · 저장된 사본을 보고 있어요')}
      else{showDisconnected();setStatus('error',errText(e).replace('저장 못 했어요','불러오지 못했어요'))}
    });
    return;
  }
  showDisconnected();
}
S.wantAdmin=(location.hash==='#admin');
boot();
})();
</script>
</body>
